[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="enterprise-agentic-rag"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi","uvicorn","pydantic-settings","pypdf","qdrant-client","flashrank","python-multipart"]
[project.optional-dependencies]
dev=["pytest","httpx"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

